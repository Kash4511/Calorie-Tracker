services:
  - type: web
    name: calorie-tracker-backend
    runtime: python
    rootDir: Backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput || true"
    startCommand: "python manage.py migrate && gunicorn Calorie.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4"
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: PYTHONUNBUFFERED
        value: "1"
